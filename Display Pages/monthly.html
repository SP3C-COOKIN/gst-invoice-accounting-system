<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monthly Dashboard</title>
    <link rel="stylesheet" href="../css/monthly.css">
</head>
<body>
    <div class="container">
        <h1 class="title">Monthly Dashboard</h1>
        <select id="month">
        <option value="" disabled selected>Select Month</option>
        <option value="01">January</option>
        <option value="02">February</option>
        <option value="03">March</option>
        <option value="04">April</option>
        <option value="05">May</option>
        <option value="06">June</option>
        <option value="07">July</option>
        <option value="08">August</option>
        <option value="09">September</option>
        <option value="10">October</option>
        <option value="11">November</option>
        <option value="12">December</option>
        </select>

        <button id="dashboardBtn">Load Dashboard</button>

        <div class="summary">
            <h1 class="titleSum">Summary</h1>

            <p>Month: <span id="monthName"></span></p>
            <p>Total Income: ₹<span id="income">0</span></p>
            <p>Total Expense: <span id="expense">0</span></p>
            <p>Profit: ₹<span id="total">0</span></p>

        </div>
    </div>

    <script src="../Inject Data js/monthly.js"></script>
</body>
</html>
